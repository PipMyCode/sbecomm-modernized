server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sbecomm-container-logs
    pipeline_stages:
      - docker: {} # Strips the raw Docker envelope formatting out first
      - json:
          expressions:
            correlationId: correlationId
            level: level
            logger: logger
      - labels:
          correlationId:
          level:
    static_configs:
      - targets:
          - localhost
        labels:
          job: app-telemetry
          env: development
          __path__: /var/lib/docker/containers/*/*log