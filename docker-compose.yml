services:
  postgres-db:
    image: postgres:17-alpine
    container_name: sbecomm-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: sbecomm-keycloak
    restart: unless-stopped
    env_file:
      - .env
    command: start-dev --import-realm
    volumes:
      - ./src/test/resources/ecomm-realm.json:/opt/keycloak/data/import/ecomm-realm.json:ro
    ports:
      - "8081:8080"
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  api:
    build: .
    container_name: sbecomm-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/ecomm-realm
    depends_on:
      postgres-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - backend-net
    # Enterprise Security Features
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sbecomm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend-net
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.1.0
    container_name: sbecomm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - backend-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  backend-net:
    driver: bridge

volumes:
  pg_data: