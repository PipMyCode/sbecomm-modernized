spring:
  jpa:
    hibernate:
      # Local Dev Only: Auto-update the schema to rapidly iterate on JPA entities
      ddl-auto: update
    # Local Dev Only: Enable SQL logging for debugging
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  stripe:
    # Local dev placeholders (never commit actual dev tokens, rely on local ENV variables if possible)
    secret-key: ${STRIPE_SECRET_KEY_DEV:dummy_stripe_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET_DEV:dummy_whsec_key}

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
