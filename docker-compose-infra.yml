services:
  postgres-db:
    image: postgres:17-alpine
    container_name: sbecomm-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    container_name: sbecomm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sbecomm-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  pg_data:
